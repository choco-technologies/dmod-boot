# OpenOCD: the USB-Serial/JTAG of the ESP32-S3 (the USB port of the board), one core.
# Replaces interface/esp_usb_jtag.cfg, which the OpenOCD of the distributions does not install (its driver is built in).
# The chip is reset when OpenOCD attaches.
adapter driver esp_usb_jtag
espusbjtag vid_pid 0x303a 0x1001
espusbjtag caps_descriptor 0x2000
adapter speed 40000
set ESP32_S3_ONLYCPU 1
