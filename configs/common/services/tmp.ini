; tmp.ini - the RAM file system at /tmp (dmramfs, tools.dmd). The root file system is the read-only dmffs embedded in the
; firmware (scripts/romfs.cmake); what has to be written to, without a medium, is written here. On a board with an
; external flash (DMBOOT_EXT_TOOLS) the unit is in /ext/cfg/services - dmramfs is on /ext, so it starts once /ext is
; mounted; stopping it with /ext does not unmount /tmp.
description=RAM file system at /tmp
exec=mount
args=-t dmramfs /tmp
type=oneshot
restart=no
