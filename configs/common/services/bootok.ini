; bootok.ini - libsystemd unit: the firmware says it works (Dmod_FirmwareReady), so that the selector keeps it. It matters
; for an image started on trial (fwupdate write|select --trial): one that does not get here - /ext does not mount, the
; console chain does not come up - is not confirmed, and after the number of starts the selector allows (3) the previous
; bank starts again. For an image that was not started on trial the call changes nothing.
; The unit is on /ext (cfg/services, made by the build like tmp.ini): it starts once /ext is mounted, which is when fwupdate
; can be run (after= of a unit in the firmware only orders the start, it does not wait for the mount). Add to after= /
; requires= what else the image needs to be up.
description=Confirm the boot of the firmware (fwupdate confirm)
exec=fwupdate
args=confirm
type=oneshot
restart=no
after=ext
requires=ext
