; The keymap of the keyboard of the T-Deck Pro (libinput, docs/keymap.md of dminput) over the built in US layers. It goes to
; /cfg/keymaps/board/keymap.ini, where libinput looks for the keymap a board ships.
;
; The keys: the codes dmtca8418's keyboard.ini gives them - letters, digits, ENTER, ... as USB HID usages, and the keys a USB keyboard has none of:
; SYM 0x100, MIC 0x101, DOLLAR 0x102.
;
; shift, alt and sym are STICKY: a tap arms the modifier for the next key only (sym, then N gives a comma); held, it acts as long as it is held.
; Two taps of shift lock the capital letters (caps), a third unlocks.
; The characters printed on the keys are the sym layer. ( ' " # ; are written as code points: they begin a comment or a string in a .ini file.

[modifiers]
shift=0xE1, 0xE5
alt=0xE2
sym=0x100
sticky=shift, alt, sym
lock=shift

[base]
0x102=$

[sym]
Q=U+0023
W=1
E=2
R=3
T=U+0028
Y=U+0029
U=_
I=-
O=+
P=@
A=*
S=4
D=5
F=6
G=/
H=:
J=U+003B
K=U+0027
L=U+0022
Z=7
X=8
C=9
V=?
B=!
N=,
M=.
0x101=0

; the Polish letters on alt (alt, then the letter)
[alt]
A=ą
C=ć
E=ę
L=ł
N=ń
O=ó
S=ś
X=ź
Z=ż

[alt+shift]
A=Ą
C=Ć
E=Ę
L=Ł
N=Ń
O=Ó
S=Ś
X=Ź
Z=Ż
