; carhmi-stop@.ini - libsystemd unit template of the board, started by the "remove" key of the [class=mount] rule in
; rules/carhmi.rules when a mount point is about to be unmounted (%i is its name, e.g. "mnt_SD"). The unmount waits
; for it.
;
; One shot: stops carhmi@%i, while the card it runs from is still there, and ends.
description=Stop the car HMI of %v
exec=service
args=stop carhmi@%i
type=oneshot
