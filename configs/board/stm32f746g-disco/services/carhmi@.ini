; carhmi@.ini - libsystemd unit template of the board: the car HMI demo, a module of the SD card (sdcard.dmd, loaded
; by name from /mnt/<label>/bin). One instance per mount point, started by carhmi-start@.ini (the [class=mount] rule in
; rules/carhmi.rules) when it is mounted: %i is the mount point's name (e.g. "mnt_SD"), %v the mount point.
;
; The view is found: the one built into the firmware (/eviews/carhmi_view/carhmi.dmv), else the one carhmi_view puts
; on the SD card (sdcard.dmd) - views/carhmi_view/carhmi.dmv on any card automount mounted (/mnt/<label>, or
; /mnt/<node name> without one). Give a path as the first argument (args=) to show another.
description=Car HMI demo (%v)
exec=carhmi
type=simple
