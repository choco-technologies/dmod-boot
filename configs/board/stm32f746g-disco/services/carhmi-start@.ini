; carhmi-start@.ini - libsystemd unit template of the board, started by the "start" key of the [class=mount] rule in
; rules/carhmi.rules when a mount point is mounted (%i is its name, e.g. "mnt_SD").
;
; One shot: starts carhmi@%i and ends. Loading carhmi - from the card, with its dependencies - takes far more stack
; than the thread that reports the mount (automount's) has, so it is done here, by a process of its own.
description=Start the car HMI of %v
exec=service
args=start carhmi@%i
type=oneshot
