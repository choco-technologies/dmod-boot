; ext.ini - libsystemd unit of the board: mounts the external flash (the 16 MB N25Q128A on QUADSPI) as a
; littlefs at /ext. The node /dev/dmspiflashx/flash is made by dmspiflash from its driver config
; (flash.dmd), which is read before the services start. The file system has to exist: create it once with
;
;   mklittlefs /dev/dmspiflashx/flash
;
; (ALL DATA IN THE FLASH IS LOST). Until then the mount fails and /ext stays empty. The directory does not have
; to exist - dmvfs makes the mount point. Modules in /ext/bin are found like the ones on a card
; (DMOD_REPO_PATHS); the default dmsecrets vault is /ext/secrets.vault (DMBOOT_DMSECRETS_PATH).
; read=256: littlefs reads the chip in units of the 'read' option (16 by default) and every read has a cost of its
; own. Measured: creating a file in a directory of ~75 modules (a compaction) took 5.5 s with 16, 1.9 s with 64,
; 1.3 s with 256.
; (The read size is not part of the on-disk format: a file system made by mklittlefs without it mounts fine.)
description=Mount the external flash (littlefs) at /ext
exec=mount
args=-t dmlittlefs -o device=/dev/dmspiflashx/flash,read=256 /ext
type=oneshot
restart=no
